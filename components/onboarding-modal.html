<!-- Onboarding Modal -->
<div id="onboarding-modal" class="onboarding-modal" style="display: none;">
  <div class="onboarding-modal-overlay"></div>
  
  <div class="onboarding-modal-content">
    <div class="onboarding-modal-header">
      <h2>Let's Personalize Your IELTS Journey</h2>
      <p>Help us understand your goals</p>
    </div>

    <form id="onboarding-form">
      <!-- Question 1: Exam Date -->
      <div class="onboarding-form-section" id="section-1" style="display: block;">
        <div class="onboarding-question-number">1 of 3</div>
        
        <label class="onboarding-question-title">When is your exam?</label>
        
        <div class="onboarding-option-group">
          <label class="onboarding-radio-option">
            <input type="radio" name="exam-date-option" value="date" id="exam-date-value">
            <span class="onboarding-radio-label">I have an exam date</span>
          </label>
          
          <div id="exam-date-picker-container" style="display: none;">
            <input type="date" id="exam-date" class="onboarding-form-input" min="">
            <small class="onboarding-hint-text" style="display: block;">
              Select your exam date (must be in future)
            </small>
          </div>

          <label class="onboarding-radio-option">
            <input type="radio" name="exam-date-option" value="unsure" id="exam-date-unsure" checked>
            <span class="onboarding-radio-label">I'm not sure yet</span>
          </label>
        </div>

        <div class="onboarding-button-group">
          <button type="button" class="onboarding-btn-secondary" onclick="skipOnboarding()">Skip</button>
          <button type="button" class="onboarding-btn-primary" onclick="nextQuestion(1)">Next</button>
        </div>
      </div>

      <!-- Question 2: Target Band -->
      <div class="onboarding-form-section" id="section-2" style="display: none;">
        <div class="onboarding-question-number">2 of 3</div>
        
        <label class="onboarding-question-title">What is your Target Band?</label>
        
        <div class="onboarding-band-selection">
          <select id="target-band" class="onboarding-form-input" required>
            <option value="">Select your target band...</option>
            <option value="5.5">5.5 - Foundation</option>
            <option value="6.0">6.0 - Competent</option>
            <option value="6.5">6.5 - Competent+</option>
            <option value="7.0">7.0 - Good</option>
            <option value="7.5">7.5 - Good+</option>
            <option value="8.0">8.0 - Very Good</option>
            <option value="8.5">8.5 - Very Good+</option>
            <option value="9.0">9.0 - Expert</option>
          </select>
        </div>

        <p class="onboarding-hint-text">
          Your target band helps us recommend appropriate practice materials
        </p>

        <div class="onboarding-button-group">
          <button type="button" class="onboarding-btn-secondary" onclick="previousQuestion(1)">Back</button>
          <button type="button" class="onboarding-btn-primary" onclick="nextQuestion(2)">Next</button>
        </div>
      </div>

      <!-- Question 3: Source -->
      <div class="onboarding-form-section" id="section-3" style="display: none;">
        <div class="onboarding-question-number">3 of 3</div>
        
        <label class="onboarding-question-title">Where did you hear about us?</label>
        
        <div class="onboarding-option-group">
          <label class="onboarding-radio-option">
            <input type="radio" name="source" value="Friend" required>
            <span class="onboarding-radio-label">
              <span class="onboarding-emoji">👥</span> Friend or colleague
            </span>
          </label>

          <label class="onboarding-radio-option">
            <input type="radio" name="source" value="Social Media" required>
            <span class="onboarding-radio-label">
              <span class="onboarding-emoji">📱</span> Social Media (Instagram, TikTok, Facebook)
            </span>
          </label>

          <label class="onboarding-radio-option">
            <input type="radio" name="source" value="Presentations" required>
            <span class="onboarding-radio-label">
              <span class="onboarding-emoji">🎓</span> School/University Presentation
            </span>
          </label>

          <label class="onboarding-radio-option">
            <input type="radio" name="source" value="Other" required>
            <span class="onboarding-radio-label">
              <span class="onboarding-emoji">🔍</span> Internet Search / Other
            </span>
          </label>
        </div>

        <div id="onboarding-error" class="onboarding-error-message" style="display: none;"></div>

        <div class="onboarding-button-group">
          <button type="button" class="onboarding-btn-secondary" onclick="previousQuestion(2)">Back</button>
          <button type="submit" class="onboarding-btn-primary" id="onboarding-submit">Complete Setup</button>
        </div>
      </div>
    </form>
  </div>
