<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown System Test</title>
    <style>
        body { font-family: system-ui; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 6px; }
        .pass { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; margin: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #test-output { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🧪 Dropdown System Test Suite</h1>
    
    <div class="info">
        <strong>Testing the comprehensive dropdown system implementation including:</strong>
        <ul>
            <li>Centralized state management</li>
            <li>Mutual exclusion between dropdowns</li>
            <li>Focus trap accessibility</li>
            <li>Click-outside detection</li>
            <li>State persistence</li>
            <li>Navigation integration</li>
        </ul>
    </div>

    <button onclick="runAllTests()">🚀 Run All Tests</button>
    <button onclick="runInteractiveTest()">🎮 Interactive Test</button>
    <button onclick="clearResults()">🗑️ Clear Results</button>

    <div id="test-output"></div>

    <script>
        // Mock the dropdown system components for testing
        var DropdownState = {
            avatar: false,
            notifications: false,
            userSearch: false
        };

        var FocusTrapManager = {
            activeTrap: null,
            previousFocus: null,
            focusableElements: 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
        };

        function toggleAvatar() {
            closeAllDropdownsExcept('avatar');
            DropdownState.avatar = !DropdownState.avatar;
            console.log('Avatar toggled:', DropdownState.avatar);
        }

        function toggleNotif() {
            closeAllDropdownsExcept('notifications');
            DropdownState.notifications = !DropdownState.notifications;
            console.log('Notifications toggled:', DropdownState.notifications);
        }

        function closeAllDropdowns() {
            DropdownState.avatar = false;
            DropdownState.notifications = false;
            DropdownState.userSearch = false;
            console.log('All dropdowns closed');
        }

        function closeAllDropdownsExcept(except) {
            if (except !== 'avatar') DropdownState.avatar = false;
            if (except !== 'notifications') DropdownState.notifications = false;
            if (except !== 'userSearch') DropdownState.userSearch = false;
        }

        function isAnyDropdownOpen() {
            return DropdownState.avatar || DropdownState.notifications || DropdownState.userSearch;
        }

        function getOpenDropdowns() {
            var open = [];
            if (DropdownState.avatar) open.push('avatar');
            if (DropdownState.notifications) open.push('notifications');
            if (DropdownState.userSearch) open.push('userSearch');
            return open;
        }

        function createFocusTrap(dropdownElement, dropdownType) {
            console.log('Focus trap created for:', dropdownType);
            return { element: dropdownElement, type: dropdownType };
        }

        function removeFocusTrap() {
            console.log('Focus trap removed');
            FocusTrapManager.activeTrap = null;
        }

        function saveDropdownState() {
            var stateToSave = {
                avatar: DropdownState.avatar,
                notifications: DropdownState.notifications,
                userSearch: DropdownState.userSearch,
                timestamp: Date.now()
            };
            sessionStorage.setItem('dropdownState', JSON.stringify(stateToSave));
            console.log('State saved:', stateToSave);
        }

        function restoreDropdownState() {
            try {
                var savedState = sessionStorage.getItem('dropdownState');
                if (savedState) {
                    var state = JSON.parse(savedState);
                    if (Date.now() - state.timestamp < 300000) {
                        console.log('State restored:', state);
                        return state;
                    }
                }
            } catch (error) {
                console.warn('Failed to restore state:', error);
            }
            return null;
        }

        // Test functions
        function addTestResult(name, passed, message) {
            const output = document.getElementById('test-output');
            const div = document.createElement('div');
            div.className = 'test-result ' + (passed ? 'pass' : 'fail');
            div.innerHTML = `<strong>${passed ? '✅' : '❌'} ${name}</strong>: ${message}`;
            output.appendChild(div);
        }

        function runAllTests() {
            clearResults();
            var passedTests = 0;
            var totalTests = 0;

            // Test 1: State Management
            totalTests++;
            if (typeof DropdownState === 'object' && 
                DropdownState.hasOwnProperty('avatar') &&
                DropdownState.hasOwnProperty('notifications') &&
                DropdownState.hasOwnProperty('userSearch')) {
                addTestResult('DropdownState Object', true, 'Centralized state management exists');
                passedTests++;
            } else {
                addTestResult('DropdownState Object', false, 'Missing state object or properties');
            }

            // Test 2: Initial State
            totalTests++;
            if (DropdownState.avatar === false && 
                DropdownState.notifications === false && 
                DropdownState.userSearch === false) {
                addTestResult('Initial State Values', true, 'All dropdowns initially closed');
                passedTests++;
            } else {
                addTestResult('Initial State Values', false, 'Initial state incorrect');
            }

            // Test 3: Avatar Toggle
            totalTests++;
            var initialState = DropdownState.avatar;
            toggleAvatar();
            var afterToggle = DropdownState.avatar;
            toggleAvatar(); // Toggle back
            var finalState = DropdownState.avatar;
            
            if (initialState === false && afterToggle === true && finalState === false) {
                addTestResult('Avatar Toggle', true, 'Toggle functionality works correctly');
                passedTests++;
            } else {
                addTestResult('Avatar Toggle', false, 'Toggle not working properly');
            }

            // Test 4: Mutual Exclusion
            totalTests++;
            closeAllDropdowns();
            toggleAvatar();
            var avatarOpen = DropdownState.avatar;
            var notifClosed = !DropdownState.notifications;
            
            toggleNotif();
            var notifOpen = DropdownState.notifications;
            var avatarClosed = !DropdownState.avatar;
            
            closeAllDropdowns();
            
            if (avatarOpen && notifClosed && notifOpen && avatarClosed) {
                addTestResult('Mutual Exclusion', true, 'Opening one dropdown closes others');
                passedTests++;
            } else {
                addTestResult('Mutual Exclusion', false, 'Mutual exclusion not working');
            }

            // Test 5: State Query Functions
            totalTests++;
            closeAllDropdowns();
            var noneOpen = !isAnyDropdownOpen();
            
            toggleAvatar();
            var oneOpen = isAnyDropdownOpen();
            var openList = getOpenDropdowns();
            
            closeAllDropdowns();
            
            if (noneOpen && oneOpen && openList.length === 1 && openList[0] === 'avatar') {
                addTestResult('State Query Functions', true, 'Query functions work correctly');
                passedTests++;
            } else {
                addTestResult('State Query Functions', false, 'Query functions not working');
            }

            // Test 6: State Persistence
            totalTests++;
            try {
                saveDropdownState();
                var restored = restoreDropdownState();
                if (restored && typeof restored.timestamp === 'number') {
                    addTestResult('State Persistence', true, 'Save and restore functions work');
                    passedTests++;
                } else {
                    addTestResult('State Persistence', false, 'State not properly restored');
                }
            } catch (error) {
                addTestResult('State Persistence', false, 'Error in persistence: ' + error.message);
            }

            // Test 7: Focus Trap Manager
            totalTests++;
            if (typeof FocusTrapManager === 'object' && 
                typeof createFocusTrap === 'function' &&
                typeof removeFocusTrap === 'function') {
                addTestResult('Focus Trap Manager', true, 'Accessibility focus trap system exists');
                passedTests++;
            } else {
                addTestResult('Focus Trap Manager', false, 'Focus trap components missing');
            }

            // Test 8: Close All Functions
            totalTests++;
            toggleAvatar();
            toggleNotif();
            closeAllDropdowns();
            var allClosed = !DropdownState.avatar && !DropdownState.notifications && !DropdownState.userSearch;
            
            if (allClosed) {
                addTestResult('Close All Functions', true, 'All dropdowns close properly');
                passedTests++;
            } else {
                addTestResult('Close All Functions', false, 'Not all dropdowns closed');
            }

            // Final results
            const percentage = Math.round((passedTests / totalTests) * 100);
            const resultDiv = document.createElement('div');
            resultDiv.className = 'test-result info';
            resultDiv.innerHTML = `
                <strong>📊 Test Suite Results:</strong><br>
                Total Tests: ${totalTests}<br>
                Passed: ${passedTests}<br>
                Failed: ${totalTests - passedTests}<br>
                Success Rate: ${percentage}%
            `;
            document.getElementById('test-output').appendChild(resultDiv);

            if (passedTests === totalTests) {
                addTestResult('🎉 ALL TESTS PASSED!', true, 'Dropdown system is working perfectly');
            } else {
                addTestResult('⚠️ SOME TESTS FAILED', false, 'Please review the implementation');
            }
        }

        function runInteractiveTest() {
            clearResults();
            addTestResult('Interactive Test', true, 'Test the dropdown system manually');
            
            const output = document.getElementById('test-output');
            const interactiveDiv = document.createElement('div');
            interactiveDiv.className = 'test-result info';
            interactiveDiv.innerHTML = `
                <strong>Interactive Testing Guide:</strong><br><br>
                <button onclick="testAvatar()">Test Avatar Dropdown</button>
                <button onclick="testNotif()">Test Notifications</button>
                <button onclick="testCloseAll()">Close All</button>
                <button onclick="testState()">Show Current State</button><br><br>
                <strong>Console Logs:</strong> Check the browser console for detailed logs<br>
                <strong>Expected Behavior:</strong><br>
                • Clicking one dropdown should close others<br>
                • State should update correctly<br>
                • Focus trap should be created/removed<br>
                • Click outside should close all dropdowns
            `;
            output.appendChild(interactiveDiv);
        }

        function testAvatar() {
            console.log('=== Testing Avatar Dropdown ===');
            toggleAvatar();
            console.log('Current state:', DropdownState);
        }

        function testNotif() {
            console.log('=== Testing Notifications Dropdown ===');
            toggleNotif();
            console.log('Current state:', DropdownState);
        }

        function testCloseAll() {
            console.log('=== Testing Close All ===');
            closeAllDropdowns();
            console.log('Current state:', DropdownState);
        }

        function testState() {
            console.log('=== Current State ===');
            console.log('DropdownState:', DropdownState);
            console.log('Open dropdowns:', getOpenDropdowns());
            console.log('Any open?', isAnyDropdownOpen());
        }

        function clearResults() {
            document.getElementById('test-output').innerHTML = '';
        }

        // Auto-run tests on page load
        window.addEventListener('load', function() {
            console.log('Dropdown System Test Suite loaded');
            console.log('Ready to test the comprehensive dropdown implementation');
        });
    </script>
</body>
</html>
