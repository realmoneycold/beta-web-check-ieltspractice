<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - IELTSPRACTICE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
        }
        
        .quick-access {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e1e5e9;
        }
        
        .quick-access h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .quick-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .quick-btn:hover {
            background: #e9ecef;
        }
        
        .info-box {
            background: #e3f2fd;
            border: 1px solid #2196f3;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #1976d2;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>IELTSPRACTICE</h1>
            <p>Test Login for Dashboard Preview</p>
        </div>
        
        <div class="info-box">
            <strong>Testing Mode:</strong> This is a simplified login for testing the dashboard dropdown system. No real authentication required.
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="student@test.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter any password" required>
            </div>
            
            <button type="submit" class="login-btn">Sign In to Dashboard</button>
        </form>
        
        <div class="quick-access">
            <h3>Quick Access (No Login Required)</h3>
            <button class="quick-btn" onclick="directAccess()">Go Directly to Dashboard</button>
            <button class="quick-btn" onclick="simulateLogin()">Simulate Student Login</button>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Simulate successful login
            localStorage.setItem('student_token', 'mock_token_' + Date.now());
            localStorage.setItem('student_user', JSON.stringify({
                full_name: email.split('@')[0],
                email: email,
                target_band: 7.0,
                current_band: 6.5,
                tasks_done: 5,
                weekly_goal_percent: 75
            }));
            
            // Show success message
            alert('Login successful! Redirecting to dashboard...');
            
            // Redirect to dashboard
            window.location.href = 'dashboard.html';
        });
        
        function directAccess() {
            alert('Going directly to dashboard (authentication bypassed)');
            window.location.href = 'dashboard.html';
        }
        
        function simulateLogin() {
            // Set mock user data
            localStorage.setItem('student_token', 'mock_token_' + Date.now());
            localStorage.setItem('student_user', JSON.stringify({
                full_name: 'Test Student',
                email: 'student@test.com',
                target_band: 7.5,
                current_band: 6.0,
                tasks_done: 12,
                weekly_goal_percent: 85
            }));
            
            alert('Student login simulated! Redirecting to dashboard...');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
